[project]
name = "shixu-work-backend"
version = "0.1.0"
description = "Single-user FastAPI and LangChain backend for Shixu Work"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "langchain>=1.0,<2",
  "langchain-deepseek>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3.0,<4",
  "ag-ui-langgraph>=0.0.34,<0.1",
  "python-dotenv>=1.0,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "pytest-asyncio>=0.26,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
